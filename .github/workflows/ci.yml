name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Питон: линт, тесты, смоук-импорт. Node здесь намеренно не используется —
  # у задачи не должно быть зависимости от того, какой он на раннере.
  checks:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff pytest pytest-asyncio pip-audit

      # Уязвимости в зависимостях. Раньше проверялось руками и, значит,
      # когда вспомнишь: pypdf и Pillow разбирают ЗАГРУЖЕННЫЕ пользователем
      # файлы, и новая CVE там — это чужой файл в нашем процессе. Падение
      # сборки на этом шаге и есть смысл: увидеть в день публикации.
      - name: Audit dependencies (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        # Токен подставляет tests/conftest.py — внешний не нужен.
        run: pytest -q

      - name: Smoke imports
        env:
          TELEGRAM_BOT_TOKEN: "dummy:token"
        run: python -c "import main, api.server, api.routes, bot.handlers, services.intake"

  # Mini App: чистые функции формы и браузерные проверки. Своя установка Node
  # и Chromium — каскад CSS и раскладку из исходника не видно, а именно там
  # ловилось почти всё, что правилось вслепую.
  webapp:
    name: Mini App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit (node --test)
        # Каталогом, а не глобом в кавычках: Node 20 сам глоб не разворачивает
        # и падает с «Could not find».
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (node --test)
        run: npm run test:e2e

  # Образ собирается тем же Dockerfile, что и на сервере.
  image:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t invoice-bot:ci .
