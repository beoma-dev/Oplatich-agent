name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff pytest pytest-asyncio

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        # Токен подставляет tests/conftest.py — внешний не нужен.
        run: pytest -q

      - name: JS tests (node --test)
        # Каталогом, а не глобом в кавычках: Node 20 сам глоб не разворачивает
        # и падает с «Could not find».
        run: node --test tests/js/

      - name: Smoke imports
        env:
          TELEGRAM_BOT_TOKEN: "dummy:token"
        run: python -c "import main, api.server, api.routes, bot.handlers, services.intake"

      - name: Docker build
        run: docker build -t invoice-bot:ci .

  # Браузерные проверки Mini App: каскад CSS и раскладку из исходника не
  # видно, а именно там ловились почти все правки вслепую. Отдельной задачей —
  # чтобы установка Chromium не тормозила основные тесты.
  browser:
    name: Mini App в браузере
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (node --test)
        run: npm run test:e2e
