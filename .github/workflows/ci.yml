name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Питон: линт, тесты, смоук-импорт. Node здесь намеренно не используется —
  # у задачи не должно быть зависимости от того, какой он на раннере.
  checks:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff pytest pytest-asyncio pip-audit

      - name: Shared Python check
        run: ./check python

  # Mini App: чистые функции формы и браузерные проверки. Своя установка Node
  # и Chromium — каскад CSS и раскладку из исходника не видно, а именно там
  # ловилось почти всё, что правилось вслепую.
  webapp:
    name: Mini App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          # Та же, что у разработчика на сервере: расхождение версий уже
          # ломало сборку — у node --test менялось, что он принимает.
          node-version: "22"
          cache: npm

      - name: Install Chromium system dependencies
        run: npm ci && npx playwright install-deps chromium
      - name: Shared Mini App check
        run: ./check web

  # Образ собирается тем же Dockerfile, что и на сервере.
  image:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: ./check image
