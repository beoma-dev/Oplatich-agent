# Бот + API в одном контейнере, HTTPS — через Caddy (сертификаты Let's Encrypt
# выпускаются и продлеваются автоматически).
#
# Перед запуском заполните .env (см. .env.example), в том числе:
#   DOMAIN=invoice.example.com          — домен, A-запись которого указывает на сервер
#   WEBAPP_URL=https://invoice.example.com/
#
# Запуск:  docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # Потолок памяти. Идёт бот на 70 МБ, но распознавание счёта поднимает
    # tesseract и Pillow — без лимита один большой PDF может увести в своп
    # весь хост, где живут ещё прокси и Caddy.
    mem_limit: 1g
    # Hardening: без эскалации привилегий и без capabilities — боту они не нужны.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Внутри контейнера слушаем все интерфейсы (наружу порт не публикуется,
      # к нему ходит только caddy по внутренней сети compose).
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      # Все данные — в одном каталоге, примонтированном с хоста.
      STORAGE_DIR: /data/storage
      USER_DIRECTORY_FILE: /data/known_users.json
      RUNTIME_SETTINGS_FILE: /data/bot_settings.json
      SECURITY_DB_FILE: /data/security.db
    volumes:
      - ./data:/data
      # JSON-ключ service account для STORAGE_BACKEND=google (каталог в .gitignore).
      - ./secrets:/app/secrets:ro
    expose:
      - "8080"
    # Потолок логов. Без него json-файл контейнера растёт бесконечно: у warp
    # он дошёл до 103 МБ на уровне DEBUG (44 МБ в сутки), а лог бота выглядел
    # маленьким только потому, что деплой пересоздаёт контейнер и обнуляет его.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Cloudflare WARP как SOCKS5 — выход к api.telegram.org.
  # В .env: PROXY_URL=socks5://warp:1080. Первый запуск регистрирует ~30 с.
  warp:
    image: caomingjun/warp
    restart: unless-stopped
    # Ест ~210 МБ; запас втрое. Прокси — единственный выход к Telegram
    # (второго нет по решению от 23.08.2026), поэтому лимит щедрый:
    # убить его нехваткой памяти хуже, чем дать лишнего.
    mem_limit: 768m
    device_cgroup_rules:
      - "c 10:200 rwm"
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    # api.telegram.org прибит к IPv4. gost берёт у резолвера РОВНО ОДИН
    # адрес и не перебирает остальные (проверено: 40 запросов подряд ушли
    # в заведомо мёртвый первый адрес), а DNS отдаёт AAAA первой — отсюда
    # 231 обрыв за трое суток. Пин убирает AAAA из выдачи и редундантности
    # не теряет: вторым адресом gost всё равно не пользуется.
    #
    # Адрес выбран ПО ДОСТИЖИМОСТИ через WARP, а не из DNS, и совпадать
    # с DNS не обязан: 25.08.2026 адрес из DNS (149.154.166.110) через
    # сессию WARP не отвечал вовсе, а этот отвечал. Если бот замолчал —
    # проверьте адрес и подберите новый тем же способом:
    #   docker compose exec -T warp sh -c '
    #     for ip in 149.154.167.220 149.154.166.110 149.154.167.197; do
    #       curl -s -o /dev/null -m 12 -w "$ip %{http_code}\n" \
    #         --resolve api.telegram.org:443:$ip https://api.telegram.org/
    #     done'
    # Тот, что отдал 302, и ставьте сюда и в TELEGRAM_PINNED_IP.
    # Достижимость проверяется ежесуточно (services/dns_pin.py).
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    sysctls:
      # НЕ ставить сюда 1. Проблема настоящая: api.telegram.org резолвится
      # и в A, и в AAAA, WARP предпочитает AAAA и упирается в таймаут —
      # за 23–25.08.2026 это дало 231 обрыв связи, и все 174 ошибки сокса
      # были вида «dial tcp [2001:67c:4e8:f004::9]:443: i/o timeout», по IPv4
      # ни одной; замер показывал 2 отказа на 20 запросов. Но лечить это
      # выключением IPv6 в netns НЕЛЬЗЯ: проверено 25.08.2026 на боевом —
      # резолвер честно стал отдавать только A-записи, и следом отвалился
      # сам туннель, «dial tcp 149.154.166.110:443: i/o timeout» уже по IPv4,
      # бот ушёл в крешлуп на 3 минуты. WARP-у IPv6 в netns нужен самому.
      # Лечить надо приоритетом резолвера (/etc/gai.conf), а не стеком.
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv4.conf.all.src_valid_mark: 1
    # Уровень логов у этого образа не настраивается: warp-svc запускается
    # без соответствующего ключа, а в warp-cli такой команды нет. Он пишет
    # DEBUG-статистику туннеля каждые несколько секунд (~44 МБ в сутки),
    # поэтому объём ограничивается только ротацией ниже.
    # Потолок логов. Без него json-файл контейнера растёт бесконечно: у warp
    # он дошёл до 103 МБ на уровне DEBUG (44 МБ в сутки), а лог бота выглядел
    # маленьким только потому, что деплой пересоздаёт контейнер и обнуляет его.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - warp_data:/var/lib/cloudflare-warp

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # Домен стенда. Пусто/не задано — сайт стенда получит stage.localhost
      # и просто не будет открываться извне; боевой сайт это не задевает.
      STAGE_DOMAIN: ${STAGE_DOMAIN:-}
    # Потолок логов. Без него json-файл контейнера растёт бесконечно: у warp
    # он дошёл до 103 МБ на уровне DEBUG (44 МБ в сутки), а лог бота выглядел
    # маленьким только потому, что деплой пересоздаёт контейнер и обнуляет его.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Сайты стенда подкладываются сюда файлом; пустой каталог безвреден.
      - ./deploy/conf.d:/etc/caddy/conf.d:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  warp_data:
