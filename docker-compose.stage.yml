# Стенд: второй бот на этой же машине. Нужен ровно для того, чего не умеет CI —
# проверить сторону Telegram (BotFather, Mini App в живом клиенте, кнопки
# карточек) и отрепетировать выкатку до того, как её увидит боевой контур.
#
# Файл ОТДЕЛЬНЫЙ намеренно: боевые команды (`docker compose up -d --build`)
# его не читают и о стенде не знают. Стенд поднимается только явно:
#
#   docker compose -f docker-compose.yml -f docker-compose.stage.yml up -d stage
#   docker compose -f docker-compose.yml -f docker-compose.stage.yml logs -f stage
#   docker compose -f docker-compose.yml -f docker-compose.stage.yml stop stage
#
# Перед первым запуском: .env.stage (см. .env.stage.example),
# deploy/conf.d/stage.caddy (см. deploy/stage.caddy.example), A-запись
# поддомена и отдельный бот в BotFather.
services:
  # Свой прокси стенду. Раньше он делил warp с боевым — и это отбирало
  # у стенда его единственный смысл в самом опасном месте: правку прокси
  # отрепетировать было НЕЛЬЗЯ, пересоздание общего контейнера роняло оба
  # контура разом. 25.08.2026 это стоило двух боевых простоев подряд.
  # Регистрация своя, том свой, боевого warp не касается вовсе.
  warp-stage:
    image: caomingjun/warp
    # См. ниже у stage: on-failure не переживает перезагрузку хоста.
    restart: unless-stopped
    # Вдвое меньше боевого: стенд никого не обслуживает, а память на машине
    # общая. Ядро одно из двух — задавить боевой контур он не должен.
    mem_limit: 384m
    cpus: "0.5"
    device_cgroup_rules:
      - "c 10:200 rwm"
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    # Тот же пин, что и в бою: gost берёт у резолвера ровно один адрес,
    # DNS отдаёт AAAA первой, а путь до IPv6 Telegram через WARP не работает.
    # Подробности и способ подобрать адрес — в docker-compose.yml.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    sysctls:
      # НЕ ставить 1: выключение IPv6 в netns роняет сам туннель, проверено.
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv4.conf.all.src_valid_mark: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - warp_stage_data:/var/lib/cloudflare-warp

  stage:
    build: .
    # unless-stopped, а не on-failure:5. Прежняя политика задумывалась как
    # «переживи флап прокси, но сдайся на настоящей ошибке», а на деле
    # означала «не поднимайся после перезагрузки НИКОГДА»: при штатном
    # выключении хоста Docker гасит контейнеры мягко, они выходят с кодом 0,
    # и on-failure их не трогает. 28.08.2026 стенд так и пролежал сутки,
    # никем не замеченный. Опасение остаётся верным — неверный токен даст
    # цикл перезапусков, — но у Docker между попытками растущая пауза, а
    # молча мёртвый стенд обходится дороже.
    restart: unless-stopped
    # Ждём здоровья прокси. Боевому такое НЕ ставим намеренно: там форма
    # должна подниматься даже при мёртвом прокси (заявка сохранится, карточка
    # догонит), а стенд никого не обслуживает и может подождать.
    depends_on:
      warp-stage:
        condition: service_healthy
    env_file: .env.stage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Пик одного экземпляра под OCR скана — 162 МБ (замер), тут троекратный
    # запас. Ядер на машине два: одно отдаём стенду, второе всегда остаётся
    # боевому контуру, чем бы стенд ни занимался.
    mem_limit: 512m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      # Пути внутри контейнера те же, что у боевого, — разный каталог на хосте.
      STORAGE_DIR: /data/storage
      USER_DIRECTORY_FILE: /data/known_users.json
      RUNTIME_SETTINGS_FILE: /data/bot_settings.json
      SECURITY_DB_FILE: /data/security.db
    volumes:
      - ./data-stage:/data
      # Боевой ./secrets стенду НЕ отдаём: с 25.08.2026 там лежит ключ
      # сервис-аккаунта Google от боевого реестра, а стенд по замыслу
      # local-only. Отдать каталог — значит дать стенду право писать
      # в настоящую таблицу и папку счетов.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  warp_stage_data:
