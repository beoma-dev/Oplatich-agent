<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Оплатыч — заявки на оплату счетов">
<!-- СГЕНЕРИРОВАНО scripts/render_brand.mjs — руками не править.
     Источник геометрии: webapp/logo.svg. Обложка Mini App 640×360 (BotFather → /newapp). Фон НЕПРОЗРАЧНЫЙ: Telegram жмёт картинку и заливает прозрачное чёрным. -->
  <defs>
    <linearGradient id="cover-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA6C6"/>
      <stop offset="52%" stop-color="#EC6493"/>
      <stop offset="100%" stop-color="#BE3466"/>
    </linearGradient>
    <radialGradient id="cover-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cover-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A82A5A" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#A82A5A" stop-opacity="0"/>
    </radialGradient>
    <filter id="cover-soft" x="-60%" y="-80%" width="220%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#cover-bg)"/>
  <ellipse cx="153.6" cy="43.199999999999996" rx="320" ry="180" fill="url(#cover-glow)"/>
  <rect x="12" y="12" width="616" height="336" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="2"/>
  <g transform="translate(0,0) scale(1)">
    <!-- Подложка под знаком ТЕМНЕЕ фона, а не светлее: кепка сама розовая, и
         на светлом углу фона держалась только за счёт обводки. С тёмной
         подложкой светлая кепка отделяется тоном, а не одной линией; текст
         справа она не задевает, поэтому белый заголовок не теряет контраст. -->
    <ellipse cx="142.81967213114754" cy="180" rx="153.82032786885244" ry="166.32000000000002" fill="url(#cover-halo)"/>
    <ellipse cx="142.81967213114754" cy="302" rx="89.72852459016393" ry="16" fill="#7A1F45" opacity=".30" filter="url(#cover-soft)"/>
    <g transform="translate(142.81967213114754,180) scale(0.5901639344262295) translate(-256,-265.5)">
  <defs>
    <radialGradient id="fur" cx="40%" cy="30%" r="76%">
      <stop offset="0%" stop-color="#F8DEA9"/>
      <stop offset="60%" stop-color="#EABF74"/>
      <stop offset="100%" stop-color="#D09C4E"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7BA6"/>
      <stop offset="100%" stop-color="#E04D80"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8FB4"/>
      <stop offset="100%" stop-color="#EC6493"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDF2EF"/>
    </linearGradient>
    <clipPath id="cap"><path d="M100 212C100 118 168 62 256 62C344 62 412 118 412 212Q256 252 100 212Z"/></clipPath>
    <clipPath id="head">
      <circle cx="256" cy="268" r="168"/>
    </clipPath>
    <radialGradient id="shade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B3B2C" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#0B3B2C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Уши держим ВЫШЕ козырька, иначе он их съедает. -->
  <g stroke="#8A5F27" stroke-width="7">
    <circle cx="132" cy="128" r="46" fill="url(#fur)"/>
    <circle cx="380" cy="128" r="46" fill="url(#fur)"/>
  </g>
  <circle cx="132" cy="128" r="24" fill="#E9A0A6"/>
  <circle cx="380" cy="128" r="24" fill="#E9A0A6"/>

  <!-- Тело-шар. -->
  <circle cx="256" cy="268" r="172" fill="url(#fur)" stroke="#8A5F27" stroke-width="8"/>

  <!-- Светлое пузико. -->
  <ellipse cx="256" cy="330" rx="104" ry="92" fill="#FCEFD3" opacity=".8"/>

  <!-- Кепочка Beoma вместо козырька счетовода: тулья по голове + тот же
       козырёк. Швы, блик и надпись обрезаны по тулье (clip cap) — иначе блик
       вылезает за силуэт и висит в воздухе над ухом. Уши остались НАД тульей
       по посадке: они выходят из-под неё по бокам, поэтому хомяк читается
       хомяком, а не шаром в кепке. -->
  <path d="M100 212C100 118 168 62 256 62C344 62 412 118 412 212Q256 252 100 212Z"
        fill="url(#band)" stroke="#B83466" stroke-width="7" stroke-linejoin="round"/>
  <g clip-path="url(#cap)">
    <g fill="none" stroke="#B83466" stroke-width="4" opacity=".38">
      <path d="M256 64Q252 150 254 238"/><path d="M180 76Q168 152 170 224"/><path d="M332 76Q344 152 342 224"/>
    </g>
    <path d="M176 92Q256 66 336 92" fill="none" stroke="#FFD3E3" stroke-width="9"
          stroke-linecap="round" opacity=".25"/>
    <path id="cap-word" d="M142 150Q256 190 370 150" fill="none"/>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="700" font-size="56" letter-spacing="1.5" fill="#FFFFFF">
      <textPath href="#cap-word" startOffset="50%" text-anchor="middle">Beoma</textPath>
    </text>
  </g>
  <circle cx="256" cy="68" r="13" fill="url(#brim)" stroke="#B83466" stroke-width="5"/>
  <!-- Тень от кепки на шерсти: без неё кепка парит над головой. -->
  <g clip-path="url(#head)">
    <path d="M96 208Q256 250 416 208L416 232Q256 274 96 232Z" fill="#7A4A2C" opacity=".18"/>
  </g>
  <path d="M78 222Q256 178 434 222L434 234Q256 266 78 234Z"
        fill="url(#brim)" stroke="#B83466" stroke-width="6" stroke-linejoin="round"/>
  <path d="M136 226Q256 258 376 226" fill="none"
        stroke="#FFC7DC" stroke-width="5" stroke-linecap="round" opacity=".45"/>

  <!-- Глаза ниже козырька: между ними и краем козырька есть воздух. -->
  <g>
    <ellipse cx="216" cy="316" rx="50" ry="55" fill="#FFFFFF" stroke="#8A5F27" stroke-width="6"/>
    <ellipse cx="296" cy="316" rx="50" ry="55" fill="#FFFFFF" stroke="#8A5F27" stroke-width="6"/>
    <circle cx="228" cy="328" r="21" fill="#2A2018"/>
    <circle cx="284" cy="328" r="21" fill="#2A2018"/>
    <circle cx="235" cy="320" r="7.5" fill="#FFFFFF"/>
    <circle cx="291" cy="320" r="7.5" fill="#FFFFFF"/>
  </g>

  <!-- Нос и улыбка. -->
  <ellipse cx="256" cy="374" rx="18" ry="13" fill="#7A4A2C"/>
  <path d="M234 396q22 24 44 0" fill="none" stroke="#7A4A2C" stroke-width="8" stroke-linecap="round"/>

  <!-- Хомячьи щёки. -->
  <circle cx="158" cy="366" r="32" fill="#E9A0A6" opacity=".5"/>
  <circle cx="354" cy="366" r="32" fill="#E9A0A6" opacity=".5"/>

  <!-- Лапки. -->
  <ellipse cx="152" cy="418" rx="42" ry="30" fill="url(#fur)" stroke="#8A5F27" stroke-width="7"/>

  <!-- Счёт: сперва бумага, поверх — лапа, поэтому читается «держит». -->
  <g transform="rotate(-11 366 412)">
    <rect x="322" y="358" width="88" height="112" rx="11" fill="url(#paper)"
          stroke="#8A5F27" stroke-width="6"/>
    <g stroke="#BCC8C2" stroke-width="6" stroke-linecap="round">
      <path d="M342 384h48"/>
      <path d="M342 405h48"/>
      <path d="M342 426h30"/>
    </g>
    <circle cx="378" cy="444" r="17" fill="none" stroke="#E04D80" stroke-width="5.5"/>
    <path d="M369.5 444l6 6.5 11.5-13" fill="none" stroke="#E04D80" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <ellipse cx="336" cy="424" rx="40" ry="29" fill="url(#fur)" stroke="#8A5F27" stroke-width="7"
           transform="rotate(-14 336 424)"/>
</g>
    <text x="275.6393442622951" y="182.64000000000001" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="700" font-size="61.5" letter-spacing="1" fill="#FFFFFF">Оплатыч</text>
    <text x="275.6393442622951" y="216.58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-weight="500" font-size="23" letter-spacing=".2" fill="#FFFFFF" fill-opacity=".86">заявки на оплату счетов</text>
  </g>
</svg>
